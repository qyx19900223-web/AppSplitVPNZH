name: Build AppSplitVPNZH RootHide

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: roothide/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Build DEB
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Verify DEB
        run: |
          set -e
          ls -lh packages/*.deb
          for f in packages/*.deb; do
            dpkg-deb -I "$f"
            dpkg-deb -c "$f"
          done

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: AppSplitVPNZH-RootHide-DEB
          path: packages/*.deb
          if-no-files-found: error
